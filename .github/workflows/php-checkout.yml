name: PHP checkout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  php80-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: none
          coverage: none
      # Existing XAMPP installations may still run PHP 8.0. The installed
      # GoPay SDK requires 8.1+, but our source must not add parse errors.
      - name: Check application source syntax on PHP 8.0
        run: |
          find src view -name '*.php' -print0 | xargs -0 -n1 php -l
          for file in index.php admin.php account.php support.php \
            comgate-callback.php comgate-return.php gopay-callback.php \
            gopay-return.php btcpay-callback.php btcpay-return.php; do
            php -l "$file"
          done
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Check PHP syntax
        run: |
          find src view tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l account.php
          php -l support.php
          php -l admin.php
          php -l index.php
          php -l comgate-callback.php
          php -l comgate-return.php
          php -l gopay-callback.php
          php -l gopay-return.php
          php -l btcpay-callback.php
          php -l btcpay-return.php
      - name: Test checkout and shared views
        run: |
          php tests/checkout-cart.php
          php tests/checkout-render.php
          php tests/checkout-availability.php
          php tests/checkout-settings.php
          php tests/mail-render.php
          php tests/after-sales-render.php
          php tests/order-legal-snapshot.php
          php tests/mail-worker.php
          php tests/bitcoin-prices.php
          php tests/btcpay-client.php
          php tests/btcpay-signature.php
          php tests/packeta-pickup.php
          php tests/packeta-shipment.php
          php tests/carrier-shipment.php
          php tests/schema-updater.php
          php tests/checkout-order.php
          php tests/order-controls.php
          php tests/order-shipping.php
          php tests/accounting.php
          php tests/tax-invoice-mail.php
          php tests/catalog-render.php
          php tests/footer-legal.php
          php tests/site-copy.php
          php tests/menu-definitions.php
          php tests/menu-manager.php
          php tests/storefront-footer.php
          php tests/url-manager.php
          php tests/account-render.php
          php tests/customer-account.php
          php tests/customer-orders.php
          php tests/admin-customers.php
          php tests/admin-render.php
          php tests/admin-auth.php
          php tests/password-reset-collation.php
          php tests/inline-editor.php
          php tests/content-editor.php
          php tests/content-deletion.php
      - name: Test cart cookie across HTTP requests
        run: bash tests/cart-http.sh
      - name: Test admin cookie across HTTP requests
        run: bash tests/admin-http.sh
      - name: Test payment QR
        run: node --test tests/payment-qr.mjs
      - name: Test PPL pickup selection
        run: node --test tests/ppl-checkout.mjs
      - name: Test GLS pickup selection
        run: node --test tests/gls-checkout.mjs
      - name: Test Balíkovna pickup selection
        run: node --test tests/balikovna-checkout.mjs
      - name: Test inline block navigation
        run: node --test tests/editor-block-navigation.mjs

  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: simple_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify full schema and tax workflow against MySQL
        env:
          MYSQL_TEST_PASSWORD: ci-only-password
        run: |
          php tests/tax-database.php
          php tests/tax-year-regime-database.php
          php tests/flat-tax-advances-database.php
          php tests/evidence-book-database.php
          php tests/mail-database.php
          php tests/after-sales-database.php
          php tests/legacy-order-migration.php
          php tests/comgate-database.php
          php tests/gopay-database.php
          php tests/btcpay-database.php
          php tests/stock-database.php
          php tests/shipping-database.php
          php tests/homepage-database.php
          php tests/supplier-links-database.php
          php tests/password-reset-database.php
          php tests/commerce-reset-database.php

  database-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: simple_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Upgrade an existing order schema on MariaDB
        env:
          MYSQL_TEST_PASSWORD: ci-only-password
        run: |
          php tests/legacy-order-migration.php
          php tests/tax-year-regime-database.php
          php tests/after-sales-database.php
          php tests/flat-tax-advances-database.php
          php tests/shipping-database.php
          php tests/homepage-database.php
          php tests/supplier-links-database.php
          php tests/commerce-reset-database.php
