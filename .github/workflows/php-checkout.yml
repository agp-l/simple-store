name: PHP checkout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded checks must not occupy runners needed by the latest revision.
concurrency:
  group: php-checkout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php80-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: none
          coverage: none
      # Existing XAMPP installations may still run PHP 8.0. The installed
      # GoPay SDK requires 8.1+, but our source must not add parse errors.
      - name: Check application source syntax on PHP 8.0
        run: |
          find src view -name '*.php' -print0 | xargs -0 -n1 php -l
          for file in index.php admin.php account.php support.php \
            comgate-callback.php comgate-return.php gopay-callback.php \
            gopay-return.php btcpay-callback.php btcpay-return.php; do
            php -l "$file"
          done
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Check PHP syntax
        run: |
          find src view tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l account.php
          php -l support.php
          php -l admin.php
          php -l index.php
          php -l comgate-callback.php
          php -l comgate-return.php
          php -l gopay-callback.php
          php -l gopay-return.php
          php -l btcpay-callback.php
          php -l btcpay-return.php
          php -l tools/apply-schema.php
          php -l tools/fio-worker.php
          php -l fio-cron.php
          php -l supplier-price-cron.php
          php -l tools/supplier-price-worker.php
      - name: Verify deployment package excludes private data
        run: |
          python3 tests/deployment.py
          python3 tests/supplier-worker.py
      - name: Test checkout and shared views
        run: |
          php tests/assisted-purchase.php
          php tests/checkout-cart.php
          php tests/checkout-render.php
          php tests/checkout-availability.php
          php tests/checkout-review.php
          php tests/checkout-settings.php
          php tests/fio-statement.php
          php tests/fio-transport-error.php
          php tests/mail-render.php
          php tests/mail-settings.php
          php tests/after-sales-render.php
          php tests/order-legal-snapshot.php
          php tests/mail-worker.php
          php tests/bitcoin-prices.php
          php tests/btcpay-client.php
          php tests/btcpay-signature.php
          php tests/packeta-pickup.php
          php tests/packeta-shipment.php
          php tests/carrier-shipment.php
          php tests/schema-updater.php
          php tests/panel-urls.php
          php tests/checkout-order.php
          php tests/order-controls.php
          php tests/order-shipping.php
          php tests/accounting.php
          php tests/tax-invoice-mail.php
          php tests/tax-documents.php
          php tests/evidence-workspace.php
          php tests/catalog-render.php
          php tests/footer-legal.php
          php tests/site-copy.php
          php tests/configuration-backup.php
          php tests/menu-definitions.php
          php tests/menu-manager.php
          php tests/storefront-footer.php
          php tests/url-manager.php
          php tests/account-render.php
          php tests/customer-account.php
          php tests/customer-orders.php
          php tests/admin-customers.php
          php tests/admin-render.php
          php tests/admin-actions.php
          php tests/admin-auth.php
          php tests/password-reset-collation.php
          php tests/password-reset-url.php
          php tests/product-import.php
          php tests/product-variants.php
          php tests/purchase-partner-transfer.php
          php tests/product-partner-assignment.php
          php tests/supplier-prices.php
          php tests/variant-link-matcher.php
          php tests/partner-link-presentation.php
          php tests/inline-editor.php
          php tests/content-cover.php
          php tests/media-catalog.php
          php tests/media-browse.php
          php tests/media-library.php
          php tests/content-management.php
          php tests/content-editor.php
          php tests/content-import.php
          php tests/content-import-controller.php
          php tests/content-deletion.php
      - name: Test cart cookie across HTTP requests
        run: bash tests/cart-http.sh
      - name: Test admin cookie across HTTP requests
        run: bash tests/admin-http.sh
      - name: Test payment QR
        run: node --test tests/payment-qr.mjs
      - name: Test media picker without external URL form
        run: node --test tests/media-picker-browser.mjs
      - name: Test ZIP import browser requests
        run: node --test tests/product-import-browser.mjs tests/product-export-browser.mjs tests/product-gallery-browser.mjs tests/product-selection-browser.mjs
      - name: Test customer order link copying
        run: node --test tests/order-link.mjs
      - name: Test PPL pickup selection
        run: node --test tests/ppl-checkout.mjs
      - name: Test GLS pickup selection
        run: node --test tests/gls-checkout.mjs
      - name: Test Balíkovna pickup selection
        run: node --test tests/balikovna-checkout.mjs
      - name: Test inline block navigation
        run: node --test tests/editor-block-navigation.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: simple_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify full schema and tax workflow against MySQL
        env:
          MYSQL_TEST_PASSWORD: ci-only-password
        run: |
          php tests/tax-database.php
          php tests/tax-year-regime-database.php
          php tests/flat-tax-advances-database.php
          php tests/osvc-evidence-database.php
          php tests/evidence-book-database.php
          php tests/mail-database.php
          php tests/after-sales-database.php
          php tests/legacy-order-migration.php
          php tests/comgate-database.php
          php tests/gopay-database.php
          php tests/btcpay-database.php
          php tests/fio-database.php
          php tests/stock-database.php
          php tests/shipping-database.php
          php tests/homepage-database.php
          php tests/product-import-database.php
          php tests/content-import-database.php
          php tests/configuration-backup-database.php
          php tests/assisted-purchase-database.php
          php tests/purchase-partners-database.php
          php tests/purchase-partner-transfer-database.php
          php tests/product-partner-assignment-database.php
          php tests/supplier-prices-database.php
          php tests/product-families-database.php
          php tests/product-sales-mass-database.php
          php tests/media-archive.php
          php tests/media-owners-database.php
          php tests/product-zip-database.php
          php tests/product-bulk-database.php
          php tests/product-mass-database.php
          php tests/product-variants-database.php
          php tests/product-variant-bulk-database.php
          php tests/catalog-selection-database.php
          php tests/product-prompt-database.php
          php tests/supplier-links-database.php
          php tests/variant-link-discovery-database.php
          php tests/password-reset-database.php
          php tests/evidence-workspace-database.php
          php tests/commerce-reset-database.php
          php tests/table-prefix-database.php
          php tests/admin-users-database.php

  database-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: simple_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Upgrade an existing order schema on MariaDB
        env:
          MYSQL_TEST_PASSWORD: ci-only-password
        run: |
          php tests/legacy-order-migration.php
          php tests/tax-year-regime-database.php
          php tests/after-sales-database.php
          php tests/flat-tax-advances-database.php
          php tests/osvc-evidence-database.php
          php tests/shipping-database.php
          php tests/homepage-database.php
          php tests/product-import-database.php
          php tests/content-import-database.php
          php tests/configuration-backup-database.php
          php tests/assisted-purchase-database.php
          php tests/purchase-partners-database.php
          php tests/purchase-partner-transfer-database.php
          php tests/product-partner-assignment-database.php
          php tests/supplier-prices-database.php
          php tests/product-families-database.php
          php tests/product-sales-mass-database.php
          php tests/media-archive.php
          php tests/media-owners-database.php
          php tests/product-zip-database.php
          php tests/product-bulk-database.php
          php tests/product-mass-database.php
          php tests/product-variants-database.php
          php tests/product-variant-bulk-database.php
          php tests/catalog-selection-database.php
          php tests/product-prompt-database.php
          php tests/supplier-links-database.php
          php tests/variant-link-discovery-database.php
          php tests/fio-database.php
          php tests/evidence-workspace-database.php
          php tests/commerce-reset-database.php
          php tests/table-prefix-database.php
          php tests/admin-users-database.php

  variant-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify variant and sale UI on desktop and mobile
        run: |
          node --test tests/product-variants-browser.mjs
          node --test tests/partner-links-browser.mjs
          node --test tests/product-sale-browser.mjs
          node --test tests/purchase-partners-browser.mjs
          node --test tests/product-partner-assignment-browser.mjs
          node --test tests/supplier-prices-browser.mjs
          node --test tests/product-families-browser.mjs
          node --test tests/product-sales-mass-browser.mjs
          node --test tests/checkout-presentation-browser.mjs
          node --test tests/tax-evidence-browser.mjs
          node --test tests/evidence-workspace-browser.mjs
          node --test tests/admin-users-browser.mjs
          node --test tests/admin-layout-browser.mjs
          node --test tests/admin-order-detail-browser.mjs
          node --test tests/admin-mail-browser.mjs
          node --test tests/admin-structure-browser.mjs
          node --test tests/admin-media-browser.mjs
          node --test tests/media-folders-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variant-ui-screenshots
          path: |
            /tmp/variant-screenshots/
            /tmp/partner-link-screenshots/
            /tmp/sale-screenshots/
            /tmp/sales-mass-screenshots/
            /tmp/checkout-presentation/
            /tmp/tax-evidence-screenshots/
            /tmp/evidence-workspace-screenshots/
            /tmp/admin-users-screenshots/
            /tmp/admin-layout-screenshots/
            /tmp/admin-order-detail-screenshots/
            /tmp/admin-mail-screenshots/
            /tmp/admin-structure-screenshots/
            /tmp/admin-media-screenshots/
            /tmp/media-folders-screenshots/
          retention-days: 7

  private-routes-apache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: Verify private routes, legacy forms and sessions on Apache
        run: bash tests/panel-apache.sh
