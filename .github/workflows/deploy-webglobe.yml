name: Deploy Webglobe test shop

on:
  workflow_dispatch:
  workflow_run:
    workflows: [PHP checkout]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: webglobe-test-shop
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.WEBGLOBE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install locked runtime dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Assemble release
        run: python3 scripts/build-release.py --output "$RUNNER_TEMP/simple-store-release"
      - name: Upload changed files over FTP
        env:
          FTP_HOST: ${{ secrets.WEBGLOBE_FTP_HOST }}
          FTP_USER: ${{ secrets.WEBGLOBE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.WEBGLOBE_FTP_PASSWORD }}
          FTP_ROOT: ${{ secrets.WEBGLOBE_FTP_ROOT }}
          FTP_SECURITY: ${{ vars.WEBGLOBE_FTP_SECURITY || 'ftp' }}
          FTP_PORT: ${{ vars.WEBGLOBE_FTP_PORT || '21' }}
        run: python3 scripts/deploy-ftp.py --package "$RUNNER_TEMP/simple-store-release"
